# Vyotish-Astro — Repository Catalog
# ===================================
# Single source of truth for every repository in the Vyotish-Astro project.
# To add a new repo: append an entry under `repos` following the same schema.
#
# Schema per repo entry:
#   name      — repository name on GitHub (required)
#   url       — full clone URL (required)
#   role      — frontend | backend | meta | tooling | docs (required)
#   stack     — main technologies (required)
#   docker    — optional Docker build info
#   notes     — free-form notes (optional)

project: Vyotish-Astro
description: >
  Vyotish astrology platform — responsive website (frontend), API (backend),
  and this meta repository tying them together.
default_branch: main

repos:
  - name: Astro-Frontend
    url: https://github.com/bhatisanjay28/Astro-Frontend.git
    role: frontend
    stack: Astro 5 + TypeScript (SSR via @astrojs/cloudflare; React islands for interactive tools)
    deploy: Cloudflare Pages/Workers (https://vyotish.com)
    docker:
      dockerfile: Dockerfile
      image: astro-frontend
      port: 80
      run: docker build -t astro-frontend . && docker run -p 8080:80 astro-frontend
    notes: >
      The public website. Live at https://vyotish.com via Cloudflare, which
      auto-builds on every push to main. Currently a Vite+React SPA with the
      approved Coming-Soon page; migrates to Astro in Epic 0.3 (DECISIONS.md D1).

  - name: Astro-Backend
    url: https://github.com/bhatisanjay28/Astro-Backend.git
    role: backend
    stack: Hono + TypeScript on Cloudflare Workers (Bun runtime for local dev; Docker bun image for dev parity)
    deploy: Cloudflare Workers (wrangler); Cron Triggers for scheduled jobs
    docker:
      dockerfile: Dockerfile
      image: astro-backend
      port: 3000
      run: docker build -t astro-backend . && docker run -p 3000:3000 astro-backend
    notes: >
      All business logic and ALL database access live here (DECISIONS.md D2/D3).
      Supabase Postgres/Auth/Storage accessed server-side only with the
      service-role key in Worker secrets. Frontend never touches Supabase.
      Currently an Express scaffold; replaced by Hono in Epic 0.2.

